[workspace]
members = [
    "crates/backend",
    "crates/cli",
    "crates/core",
    "crates/ffmpeg",
    "crates/gui/src-tauri",
    "crates/runtime",
    "crates/tui",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["Gleb Nechaev and SonicMux contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gl-epka/sonicmux"
homepage = "https://github.com/gl-epka/sonicmux"
readme = "README.md"
keywords = ["mkv", "ffmpeg", "dts", "ac3", "audio"]
categories = ["command-line-utilities", "multimedia::audio", "multimedia::video"]

[workspace.dependencies]
anyhow = "1.0.104"
anstream = "1.0.0"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive", "cargo"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.2"
color-eyre = "0.6.5"
command-group = { version = "5.0.1", features = ["with-tokio"] }
directories = "6.0.0"
glob = "0.3.4"
globset = "=0.4.19"
indicatif = "0.18.6"
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
renamore = "0.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-dialog = "2.7.2"
walkdir = "2.5.0"
which = "8.0.5"

insta = "1.48.0"
proptest = "1.11.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
trycmd = "1.2.1"

sonicmux-core = { path = "crates/core", version = "0.1.0" }
sonicmux-backend = { path = "crates/backend", version = "0.1.0" }
sonicmux-ffmpeg = { path = "crates/ffmpeg", version = "0.1.0" }
sonicmux-runtime = { path = "crates/runtime", version = "0.1.0" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
