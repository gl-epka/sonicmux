[workspace]
members = [
    "crates/backend",
    "crates/cli",
    "crates/core",
    "crates/ffmpeg",
    "crates/gui/src-tauri",
    "crates/runtime",
    "crates/tui",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["SonicMux contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
color-eyre = "0.6.5"
command-group = { version = "5.0.1", features = ["with-tokio"] }
renamore = "0.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

insta = "1.48.0"
proptest = "1.11.0"

sonicmux-core = { path = "crates/core", version = "0.1.0" }
sonicmux-backend = { path = "crates/backend", version = "0.1.0" }
sonicmux-ffmpeg = { path = "crates/ffmpeg", version = "0.1.0" }
sonicmux-runtime = { path = "crates/runtime", version = "0.1.0" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
