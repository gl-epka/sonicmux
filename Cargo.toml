[workspace]
members = [
    "crates/cli",
    "crates/core",
    "crates/ffmpeg",
    "crates/gui/src-tauri",
    "crates/runtime",
    "crates/tui",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["SonicMux contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
color-eyre = "0.6.5"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

sonicmux-core = { path = "crates/core", version = "0.1.0" }
sonicmux-ffmpeg = { path = "crates/ffmpeg", version = "0.1.0" }
sonicmux-runtime = { path = "crates/runtime", version = "0.1.0" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
