name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version to validate and build without publishing
        required: true
        default: v0.1.0

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

jobs:
  verify:
    name: Verify release identity
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
      - name: Verify versions
        run: distribution/check-version.sh "$RELEASE_TAG"
      - name: Verify annotated tag on main
        if: github.ref_type == 'tag'
        run: |
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git fetch origin main
          git merge-base --is-ancestor "${{ github.sha }}" origin/main
      - name: List root crate contents
        run: cargo package --locked --list -p sonicmux-core
      - name: Package root crate
        run: cargo publish --locked --dry-run -p sonicmux-core
      - name: Generate release notes
        run: distribution/release-notes.sh "${RELEASE_TAG#v}" RELEASE_NOTES.md
      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

  cli-linux:
    name: CLI Linux (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust target
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build CLI and TUI
        run: cargo build --release --locked --target "${{ matrix.target }}" -p sonicmux -p sonicmux-tui
      - name: Package CLI and TUI
        run: distribution/package-cli-unix.sh "${{ matrix.target }}" release-assets
      - name: Upload release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  cli-windows:
    name: CLI Windows (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust target
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - name: Build CLI and TUI
        run: cargo build --release --locked --target "${{ matrix.target }}" -p sonicmux -p sonicmux-tui
      - name: Package CLI and TUI
        shell: pwsh
        run: ./distribution/package-cli.ps1 -TargetTriple "${{ matrix.target }}" -OutputDirectory release-assets
      - name: Upload release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  cli-macos:
    name: CLI macOS universal
    needs: verify
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust targets
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          target: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build both macOS slices
        run: |
          cargo build --release --locked --target aarch64-apple-darwin -p sonicmux -p sonicmux-tui
          cargo build --release --locked --target x86_64-apple-darwin -p sonicmux -p sonicmux-tui
          mkdir -p target/universal-apple-darwin/release
          lipo -create target/{aarch64,x86_64}-apple-darwin/release/sonicmux -output target/universal-apple-darwin/release/sonicmux
          lipo -create target/{aarch64,x86_64}-apple-darwin/release/sonicmux-tui -output target/universal-apple-darwin/release/sonicmux-tui
      - name: Package CLI and TUI
        run: distribution/package-cli-unix.sh universal-apple-darwin release-assets
      - name: Upload release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-universal-apple-darwin
          path: release-assets/*
          if-no-files-found: error

  gui-linux:
    name: GUI Linux (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust target
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/gui/package-lock.json
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential gnupg jq nasm xz-utils libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Fetch and verify FFmpeg source
        run: distribution/ffmpeg/fetch.sh "$RUNNER_TEMP/ffmpeg-source"
      - name: Build and verify FFmpeg
        run: |
          distribution/ffmpeg/build.sh "$RUNNER_TEMP/ffmpeg-source/ffmpeg-8.1.2" "$RUNNER_TEMP/ffmpeg-install"
          distribution/ffmpeg/verify.sh "$RUNNER_TEMP/ffmpeg-install/bin/ffmpeg" "$RUNNER_TEMP/ffmpeg-install/bin/ffprobe"
          distribution/ffmpeg/stage-sidecars.sh "$RUNNER_TEMP/ffmpeg-install/bin" "${{ matrix.target }}"
      - name: Convert a real DTS fixture with the sidecar
        env:
          SONICMUX_RUN_FFMPEG_TESTS: "1"
          FFMPEG_PATH: ${{ runner.temp }}/ffmpeg-install/bin/ffmpeg
          FFPROBE_PATH: ${{ runner.temp }}/ffmpeg-install/bin/ffprobe
        run: cargo test --locked -p sonicmux-runtime --test ffmpeg_execution
      - name: Install frontend dependencies
        working-directory: crates/gui
        run: npm ci
      - name: Build unsigned GUI packages
        working-directory: crates/gui
        run: npm run tauri build -- --target "${{ matrix.target }}" --bundles appimage,deb --config src-tauri/tauri.release.conf.json
      - name: Collect release assets
        run: |
          mkdir release-assets ffmpeg-package
          version="${RELEASE_TAG#v}"
          cp target/${{ matrix.target }}/release/bundle/appimage/*.AppImage "release-assets/sonicmux-gui-v$version-${{ matrix.target }}-unsigned-preview.AppImage"
          cp target/${{ matrix.target }}/release/bundle/deb/*.deb "release-assets/sonicmux-gui-v$version-${{ matrix.target }}-unsigned-preview.deb"
          cp "$RUNNER_TEMP/ffmpeg-install/bin/ffmpeg" "$RUNNER_TEMP/ffmpeg-install/bin/ffprobe" ffmpeg-package/
          cp "$RUNNER_TEMP/ffmpeg-install/build-manifest.json" ffmpeg-package/
          cp "$RUNNER_TEMP/ffmpeg-install/changes.diff" ffmpeg-package/
          cp THIRD_PARTY_LICENSES.md distribution/ffmpeg/README.md distribution/ffmpeg/configure-flags.txt distribution/ffmpeg/COPYING.LGPLv2.1 ffmpeg-package/
          tar -cJf "release-assets/sonicmux-ffmpeg-8.1.2-${{ matrix.target }}.tar.xz" ffmpeg-package
          cp "$RUNNER_TEMP/ffmpeg-install/build-manifest.json" "release-assets/ffmpeg-build-${{ matrix.target }}.json"
          cp "$RUNNER_TEMP/ffmpeg-install/changes.diff" "release-assets/ffmpeg-changes-${{ matrix.target }}.diff"
          if [[ "${{ matrix.target }}" == x86_64-* ]]; then
            cp "$RUNNER_TEMP/ffmpeg-source/ffmpeg-8.1.2.tar.xz" release-assets/
            cp "$RUNNER_TEMP/ffmpeg-source/ffmpeg-8.1.2.tar.xz.asc" release-assets/
            cp "$RUNNER_TEMP/ffmpeg-source/ffmpeg-devel.asc" release-assets/
          fi
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  gui-windows:
    name: GUI Windows (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            msystem: UCRT64
            toolchain: mingw-w64-ucrt-x86_64-toolchain
            cc: gcc
            ffmpeg_flags: --arch=x86_64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-toolchain
            cc: clang
            ffmpeg_flags: --arch=aarch64 --enable-cross-compile --host-cc=clang
    runs-on: ${{ matrix.runner }}
    environment:
      name: ${{ github.ref_type == 'tag' && 'release-signing' || 'release-preview' }}
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust target
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/gui/package-lock.json
      - name: Install MSYS2 build environment
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel diffutils gnupg jq make nasm xz
            ${{ matrix.toolchain }}
      - name: Fetch, build, and verify FFmpeg
        shell: msys2 {0}
        run: |
          distribution/ffmpeg/fetch.sh "$RUNNER_TEMP/ffmpeg-source"
          CC='${{ matrix.cc }}' SONICMUX_FFMPEG_EXTRA_FLAGS='${{ matrix.ffmpeg_flags }}' distribution/ffmpeg/build.sh "$RUNNER_TEMP/ffmpeg-source/ffmpeg-8.1.2" "$RUNNER_TEMP/ffmpeg-install"
          distribution/ffmpeg/verify.sh "$RUNNER_TEMP/ffmpeg-install/bin/ffmpeg.exe" "$RUNNER_TEMP/ffmpeg-install/bin/ffprobe.exe"
          distribution/ffmpeg/stage-sidecars.sh "$RUNNER_TEMP/ffmpeg-install/bin" "${{ matrix.target }}"
      - name: Upload FFmpeg configure log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-config-${{ matrix.target }}
          path: ${{ runner.temp }}/ffmpeg-source/ffmpeg-8.1.2/ffbuild/config.log
          if-no-files-found: warn
          retention-days: 3
      - name: Convert a real DTS fixture with the sidecar
        shell: pwsh
        env:
          SONICMUX_RUN_FFMPEG_TESTS: "1"
          FFMPEG_PATH: ${{ runner.temp }}\ffmpeg-install\bin\ffmpeg.exe
          FFPROBE_PATH: ${{ runner.temp }}\ffmpeg-install\bin\ffprobe.exe
        run: cargo test --locked -p sonicmux-runtime --test ffmpeg_execution
      - name: Install frontend dependencies
        working-directory: crates/gui
        run: npm ci
      - name: Build GUI executable
        working-directory: crates/gui
        run: npm run tauri build -- --target "${{ matrix.target }}" --no-bundle --config src-tauri/tauri.release.conf.json
      - name: Authenticode-sign executable and sidecars when credentials exist
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'sonicmux-signing.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signTool = (Get-Command signtool.exe -ErrorAction Stop).Source
          $files = @(
            "target/${{ matrix.target }}/release/sonicmux-gui.exe",
            "crates/gui/src-tauri/binaries/ffmpeg-${{ matrix.target }}.exe",
            "crates/gui/src-tauri/binaries/ffprobe-${{ matrix.target }}.exe"
          )
          foreach ($file in $files) {
            & $signTool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD $file
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $file" }
            & $signTool verify /pa /all $file
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $file" }
          }
      - name: Bundle GUI installers
        working-directory: crates/gui
        run: npm run tauri bundle -- --target "${{ matrix.target }}" --bundles nsis,msi --config src-tauri/tauri.release.conf.json
      - name: Authenticode-sign installers when credentials exist
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'sonicmux-signing.pfx'
          $signTool = (Get-Command signtool.exe -ErrorAction Stop).Source
          $installers = Get-ChildItem -LiteralPath "target/${{ matrix.target }}/release/bundle" -Recurse -File | Where-Object { $_.Extension -in '.msi', '.exe' }
          foreach ($installer in $installers) {
            & $signTool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $($installer.FullName)" }
            & $signTool verify /pa /all $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $($installer.FullName)" }
          }
      - name: Collect release assets
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          New-Item -ItemType Directory -Force -Path release-assets, ffmpeg-package | Out-Null
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/ffmpeg-install/bin/ffmpeg.exe", "$env:RUNNER_TEMP/ffmpeg-install/bin/ffprobe.exe" -Destination ffmpeg-package
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/ffmpeg-install/build-manifest.json", "$env:RUNNER_TEMP/ffmpeg-install/changes.diff", THIRD_PARTY_LICENSES.md, distribution/ffmpeg/README.md, distribution/ffmpeg/configure-flags.txt, distribution/ffmpeg/COPYING.LGPLv2.1 -Destination ffmpeg-package
          Compress-Archive -LiteralPath ffmpeg-package -DestinationPath "release-assets/sonicmux-ffmpeg-8.1.2-${{ matrix.target }}.zip"
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/ffmpeg-install/build-manifest.json" -Destination "release-assets/ffmpeg-build-${{ matrix.target }}.json"
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/ffmpeg-install/changes.diff" -Destination "release-assets/ffmpeg-changes-${{ matrix.target }}.diff"
          $msi = @(Get-ChildItem -LiteralPath "target/${{ matrix.target }}/release/bundle/msi" -Filter *.msi -File -ErrorAction Stop)
          $nsis = @(Get-ChildItem -LiteralPath "target/${{ matrix.target }}/release/bundle/nsis" -Filter *-setup.exe -File -ErrorAction Stop)
          if ($msi.Count -ne 1) { throw "Expected exactly one MSI, found $($msi.Count)" }
          if ($nsis.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($nsis.Count)" }
          Copy-Item -LiteralPath $msi[0].FullName -Destination "release-assets/sonicmux-gui-v$version-${{ matrix.target }}-unsigned-preview.msi"
          Copy-Item -LiteralPath $nsis[0].FullName -Destination "release-assets/sonicmux-gui-v$version-${{ matrix.target }}-unsigned-preview-setup.exe"
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  gui-macos:
    name: GUI macOS universal
    needs: verify
    runs-on: macos-15
    environment:
      name: ${{ github.ref_type == 'tag' && 'release-signing' || 'release-preview' }}
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust targets
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          target: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/gui/package-lock.json
      - name: Install FFmpeg build dependencies
        run: brew install gnupg jq nasm xz
      - name: Fetch and build FFmpeg slices
        run: |
          distribution/ffmpeg/fetch.sh "$RUNNER_TEMP/ffmpeg-source"
          cp -R "$RUNNER_TEMP/ffmpeg-source/ffmpeg-8.1.2" "$RUNNER_TEMP/ffmpeg-source-x86_64"
          distribution/ffmpeg/build.sh "$RUNNER_TEMP/ffmpeg-source/ffmpeg-8.1.2" "$RUNNER_TEMP/ffmpeg-arm64"
          CC='clang -arch x86_64' SONICMUX_FFMPEG_EXTRA_FLAGS='--arch=x86_64' distribution/ffmpeg/build.sh "$RUNNER_TEMP/ffmpeg-source-x86_64" "$RUNNER_TEMP/ffmpeg-x86_64"
          mkdir -p "$RUNNER_TEMP/ffmpeg-universal/bin"
          lipo -create "$RUNNER_TEMP/ffmpeg-arm64/bin/ffmpeg" "$RUNNER_TEMP/ffmpeg-x86_64/bin/ffmpeg" -output "$RUNNER_TEMP/ffmpeg-universal/bin/ffmpeg"
          lipo -create "$RUNNER_TEMP/ffmpeg-arm64/bin/ffprobe" "$RUNNER_TEMP/ffmpeg-x86_64/bin/ffprobe" -output "$RUNNER_TEMP/ffmpeg-universal/bin/ffprobe"
          jq -n \
            --slurpfile arm "$RUNNER_TEMP/ffmpeg-arm64/build-manifest.json" \
            --slurpfile intel "$RUNNER_TEMP/ffmpeg-x86_64/build-manifest.json" \
            --arg ffmpeg_sha256 "$(shasum -a 256 "$RUNNER_TEMP/ffmpeg-universal/bin/ffmpeg" | awk '{print $1}')" \
            --arg ffprobe_sha256 "$(shasum -a 256 "$RUNNER_TEMP/ffmpeg-universal/bin/ffprobe" | awk '{print $1}')" \
            '{schema_version: 1, target: "universal-apple-darwin", ffmpeg_sha256: $ffmpeg_sha256, ffprobe_sha256: $ffprobe_sha256, slices: [$arm[0], $intel[0]]}' \
            > "$RUNNER_TEMP/ffmpeg-universal/build-manifest.json"
          : > "$RUNNER_TEMP/ffmpeg-universal/changes.diff"
          distribution/ffmpeg/verify.sh "$RUNNER_TEMP/ffmpeg-universal/bin/ffmpeg" "$RUNNER_TEMP/ffmpeg-universal/bin/ffprobe"
          distribution/ffmpeg/stage-sidecars.sh "$RUNNER_TEMP/ffmpeg-arm64/bin" aarch64-apple-darwin
          distribution/ffmpeg/stage-sidecars.sh "$RUNNER_TEMP/ffmpeg-x86_64/bin" x86_64-apple-darwin
          distribution/ffmpeg/stage-sidecars.sh "$RUNNER_TEMP/ffmpeg-universal/bin" universal-apple-darwin
          SONICMUX_RUN_FFMPEG_TESTS=1 FFMPEG_PATH="$RUNNER_TEMP/ffmpeg-universal/bin/ffmpeg" FFPROBE_PATH="$RUNNER_TEMP/ffmpeg-universal/bin/ffprobe" cargo test --locked -p sonicmux-runtime --test ffmpeg_execution
      - name: Install frontend dependencies
        working-directory: crates/gui
        run: npm ci
      - name: Build signed universal GUI packages
        if: env.APPLE_SIGNING_IDENTITY != ''
        working-directory: crates/gui
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json
      - name: Build unsigned universal GUI packages
        if: env.APPLE_SIGNING_IDENTITY == ''
        working-directory: crates/gui
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json
      - name: Verify Apple signature and notarization when credentials exist
        if: env.APPLE_SIGNING_IDENTITY != ''
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          app_path=$(find target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -type d -print -quit)
          dmg_path=$(find target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -type f -print -quit)
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$dmg_path"
      - name: Collect release assets
        run: |
          mkdir release-assets ffmpeg-package
          version="${RELEASE_TAG#v}"
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "release-assets/sonicmux-gui-v$version-universal-apple-darwin-unsigned-preview.dmg"
          app_path=$(find target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -type d -print -quit)
          tar -cJf "release-assets/sonicmux-gui-v$version-universal-apple-darwin-unsigned-preview.app.tar.xz" -C "$(dirname "$app_path")" "$(basename "$app_path")"
          cp "$RUNNER_TEMP/ffmpeg-universal/bin/ffmpeg" "$RUNNER_TEMP/ffmpeg-universal/bin/ffprobe" ffmpeg-package/
          cp "$RUNNER_TEMP/ffmpeg-universal/build-manifest.json" "$RUNNER_TEMP/ffmpeg-universal/changes.diff" ffmpeg-package/
          cp THIRD_PARTY_LICENSES.md distribution/ffmpeg/README.md distribution/ffmpeg/configure-flags.txt distribution/ffmpeg/COPYING.LGPLv2.1 ffmpeg-package/
          tar -cJf "release-assets/sonicmux-ffmpeg-8.1.2-universal-apple-darwin.tar.xz" ffmpeg-package
          cp "$RUNNER_TEMP/ffmpeg-universal/build-manifest.json" release-assets/ffmpeg-build-universal-apple-darwin.json
          cp "$RUNNER_TEMP/ffmpeg-universal/changes.diff" release-assets/ffmpeg-changes-universal-apple-darwin.diff
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-universal-apple-darwin
          path: release-assets/*
          if-no-files-found: error

  assemble:
    name: Checksums, SBOM, provenance, and draft release
    needs: [cli-linux, cli-windows, cli-macos, gui-linux, gui-windows, gui-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download CLI assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: release-assets
          merge-multiple: true
      - name: Download GUI and FFmpeg assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gui-*
          path: release-assets
          merge-multiple: true
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: release-notes
      - name: Add notices and source manifest
        run: |
          cp THIRD_PARTY_LICENSES.md distribution/ffmpeg/COPYING.LGPLv2.1 distribution/ffmpeg/manifest.json distribution/ffmpeg/configure-flags.txt release-assets/
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: release-assets/sonicmux-${{ env.RELEASE_TAG }}.spdx.json
      - name: Generate checksums
        run: distribution/checksums.sh release-assets
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Upload complete release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonicmux-${{ env.RELEASE_TAG }}-release
          path: release-assets/*
          if-no-files-found: error
      - name: Create draft GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag --title "SonicMux ${RELEASE_TAG#v}" --notes-file release-notes/RELEASE_NOTES.md

  publish:
    name: Publish crates and release
    if: github.ref_type == 'tag'
    needs: assemble
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
      - name: Publish registry packages in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: distribution/publish-crates.sh "$RELEASE_TAG"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
